    board_participant_title: "Запитання учасників"
    board_developer_title: "Запитання розробників"
    sections:
      - title: "Чому це дослідження важливе"
        items:
          - q: "Що таке Sugar-Sugar?"
            a: "Sugar-Sugar — це веб-застосунок для досліджень, побудований на Dash. Він перетворює прогнозування глюкози на інтерактивну гру: ти бачиш частину CGM-кривої, малюєш, як вона продовжиться, і порівнюєш прогноз із реальними значеннями. Мета — виміряти, наскільки точно люди можуть передбачати короткострокову динаміку глюкози."
          - q: "Це справжнє наукове дослідження?"
            a: "Так. Sugar-Sugar є частиною реального дослідницького проєкту. Дослідження отримало дозвіл Комітету з етики Університетської медицини Ростока (Universitätsmedizin Rostock) в Німеччині — ми згадуємо це як частину контексту дослідження, щоб ти знав/ла, що воно проводиться відповідально."
          - q: "Чому прогнозування глюкози важливе для людей із діабетом?"
            a: "Для людей із діабетом точні короткострокові прогнози глюкози можуть підтримувати безпечніші повсякденні рішення щодо інсуліну, вуглеводів, фізичної активності та вибору часу. Кращий прогноз допомагає зменшити небезпечні підйоми та падіння і зробити управління глюкозою менш стресовим."
          - q: "Чому прогнозування глюкози важливе для людей без діабету?"
            a: "Глюкоза — це ключовий метаболічний сигнал, повʼязаний із енергією, когніцією, настроєм, реакцією на фізичні навантаження та довгостроковим здоровʼям. Для людей без діабету прогнозування може розкрити, як їжа, сон, стрес і активність впливають на метаболізм у реальному часі — це корисно для профілактики та оптимізації способу життя."
          - q: "Чому точність людини така важлива для машинного навчання?"
            a: "Наразі не існує опублікованого еталонного показника точності людини для прогнозування CGM-глюкози. Без розуміння того, наскільки добре поінформована людина може прогнозувати тренди глюкози, неможливо оцінити, чи справді корисна будь-яка модель ШІ — вона може бути гіршою за досвідченого діабетика або кращою лише в певних сценаріях. Це дослідження встановлює такий еталон, щоб майбутні моделі ШІ можна було порівнювати осмислено."
          - q: "Людина знає набагато більше, ніж показує будь-який графік — їжу, сон, стрес, травлення, цикл. Без усього цього, хіба це не ворожіння на графіках?"
            a: >-
              Коли ти дивишся на свій CGM-графік, ти вже інтуїтивно відчуваєш, куди рухається глюкоза.
              Ти не перераховуєш кожен фактор свідомо. Ти дивишся на криву і зчитуєш те, що вже відбувається.


              Це працює, тому що все, що ти не записав, усе одно відображається в глюкозі.
              Постпрандіальний стрибок виглядає як постпрандіальний стрибок — незалежно від того, чи були введені вуглеводи.
              Активний інсулін тягне криву вниз упізнаваним чином.
              Лінія глюкози — це результат усього, що відбувається, навіть того, що не було зафіксовано.


              Крім того, якщо ти завантажиш свої CGM-дані, графік покаже зафіксовані вуглеводи, інсулін та фізичну активність як маркери. Тож це не просто гола лінія глюкози.


              Чи це схоже на «технічний аналіз» у біржовій торгівлі? Ні.
              Ціни акцій рухаються під впливом психології натовпу, а сам прогноз рухає ринок.
              Глюкоза — це біохімія. Інсулін має відому криву дії. Вуглеводи засвоюються з відомою швидкістю.
              Наступна година здебільшого випливає з того, що вже відбувається просто зараз.


              Дослідження це підтверджують: порівняння моделей прогнозування глюкози з урахуванням і без урахування прийомів їжі та інсуліну
              показало, що додавання цих коваріатів не покращило короткострокову точність
              ([Daniels et al., 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC8782424/);
              [The Maastricht Study, 2021](https://pmc.ncbi.nlm.nih.gov/articles/PMC8224858/)).
              Самого CGM-сигналу достатньо для прогнозу на наступну годину.


              Ми не просимо нікого описувати весь свій день моделі.
              Питання в іншому: дивлячись на екран, наскільки точно ти можеш визначити, куди рухається глюкоза?
      - title: "Як проводиться дослідження"
        items:
          - q: "Хто може брати участь?"
            a: "Усі 18+. Користувачі CGM особливо цінні, але люди без CGM також можуть грати з публічними анонімізованими даними."
          - q: "Які CGM-пристрої та формати підтримуються?"
            a: "Підтримуються Dexcom, Libre, Medtronic і Nightscout. Також доступний публічний анонімізований набір даних, якщо у тебе немає CGM-пристрою."
          - q: "Скільки часу це займає?"
            a: "Кожен раунд займає приблизно 2–3 хвилини. Повна сесія (12 раундів) — близько 30 хвилин, але її можна розбити на кілька відвідувань."
          - q: "Чи можу я зупинитися посередині і продовжити пізніше?"
            a: "Так. Гра зберігає твій прогрес локально в браузері. Якщо 12 раундів здаються забагато за один раз — закрий вкладку і повернися пізніше, тобі запропонують продовжити з того місця. Навіть кілька раундів корисні, але кожен додатковий раунд покращує якість даних."
          - q: "Чи можна грати більше ніж один раз?"
            a: "Так — за умови, що кожне проходження — це окрема сесія. Навичка прогнозу може покращуватися з практикою, тож результати не є фіксованими: точність може зростати поступово від спроби до спроби. Запуск нової сесії (а не продовження тієї самої) зберігає ці спроби окремими, щоб таке покращення можна було відстежити в часі."
          - q: "Що, якщо мені не подобаються мої результати? Чи варто починати заново?"
            a: "Будь ласка, не починай заново лише тому, що тебе не влаштовує точність. Люди природно схильні зберігати хороші результати й відкидати погані — але це спотворить дослідження і зробить результати менш науково валідними. Найкраще — продовжити наступним раундом, а не скидати прогрес."
          - q: "Які метрики точності використовуються?"
            a: "Ми використовуємо стандартні метрики прогнозування — MAE, RMSE і MAPE — щоб виміряти, наскільки твоя передбачена крива глюкози відповідала реальній. MAE — середня абсолютна похибка: показує, наскільки ти помилявся/лась у середньому. RMSE сильніше штрафує великі помилки, виділяючи випадки, де прогноз був дуже невірним. MAPE виражає похибку у відсотках, що зручно для порівняння в різних діапазонах глюкози. Разом ці метрики дають повнішу картину, ніж один показник."
          - q: "Які обмеження цього дослідження?"
            a: >-
              Ми хочемо бути відвертими:

              - **Лише короткий горизонт.** Ми просимо прогнозувати наступну годину. Довгостроковий прогноз — значно складніша задача, де домінують невиміряні фактори.

              - **Зафіксовані події можуть бути неповними.** Графік показує те, що записав твій CGM-додаток — якщо ти не зафіксував прийом їжі або дозу інсуліну, вони не зʼявляться, і ти, і модель працюєте з однаково неповною картиною.

              - **Немає персонального контексту.** У реальному житті ти знаєш речі, яких немає в даних — що починаєш хворіти, що збираєшся на пробіжку, що це вже третя кава. Це дослідження ізолює здатність читати графік від особистих знань.

              - **Немає тиску реального часу.** Спокійно малювати лінію прогнозу — це зовсім інше, ніж приймати рішення щодо дозування о другій ночі напівсонним.

              - **Публічні vs. власні дані.** Якщо ти граєш із публічними анонімізованими записами, твоя точність може відрізнятися від прогнозування власної глюкози. Ми заохочуємо завантажити власний CGM-експорт (Dexcom, Libre, Medtronic або Nightscout) — твоя особиста інтуїція щодо власних патернів є частиною того, що робить порівняння з ML цікавим.
      - title: "Як завантажити CSV з CGM"
        id: download-csv
        items:
          - q: "Чому не можна експортувати з додатка на телефоні?"
            a: "Більшість CGM-додатків на телефоні дають лише PDF-звіти. Сирий CSV береться з сайту виробника або з відкритих додатків на кшталт xDrip+ і Nightscout."
          - q: "Dexcom (Clarity)"
            a: >-
              1. Відкрий [clarity.dexcom.com](https://clarity.dexcom.com) (США) або [clarity.dexcom.eu](https://clarity.dexcom.eu) (Європа) і увійди в акаунт Dexcom.

              2. Відкрий будь-який звіт і натисни **Export** зверху.

              3. Обери період (14, 30, 90 днів або свій) і завантаж CSV.


              Додаток Clarity не вміє експортувати CSV — користуйся сайтом.


              Відео: [завантаження в Clarity](https://www.youtube.com/watch?v=GTULvbiAkfc), [навігація Clarity](https://www.youtube.com/watch?v=hNSeKZXV1sM), [експорт G6 / Clarity](https://www.youtube.com/watch?v=7v-d_FKs6Oo).
          - q: "Abbott FreeStyle Libre (LibreView)"
            a: >-
              1. Відкрий [libreview.com](https://www.libreview.com) і увійди тим самим акаунтом, що в додатку Libre.

              2. Натисни значок **Glucose History** (хвиля тренду) зліва зверху.

              3. Натисни **Download Glucose Data** справа зверху, пройди капчу і завантаж файл.


              Не відкривай і не перезберігай файл в Excel — так можна зіпсувати дані. Завантажуй як є.


              Відео: [налаштування LibreView](https://www.youtube.com/watch?v=xBa6JJEdqcI), [експорт TypeOneTalks](https://www.youtube.com/watch?v=l09GPGQXOLE).
          - q: "Medtronic (CareLink)"
            a: >-
              1. Відкрий [carelink.minimed.com](https://carelink.minimed.com) і увійди.

              2. Нові помпи (770G / 780G) синхронізуються через MiniMed Mobile. Старим потрібен CareLink USB або Contour Next Link.

              3. Перейди в **Reports → Data Export (CSV)**.


              Відео: [огляд CareLink](https://www.youtube.com/watch?v=WGO1YnVJ0eo), [налаштування завантажувача](https://www.youtube.com/watch?v=u_oC2EubVT4).
          - q: "Glooko, Tidepool, xDrip+ або Nightscout"
            a: >-
              **Glooko:** [my.glooko.com](https://my.glooko.com) → Summary → Export as CSV.

              **Tidepool:** Settings (шестерня) → Export My Data → обери дати → завантаж.

              **xDrip+:** Меню → Import/Export → Export CSV (формат SiDiary).

              **Nightscout:** встав URL свого сайту на екрані старту або прогнозу — файл не потрібен.
      - title: "Дані та конфіденційність"
        items:
          - q: "Чи зберігаються мої дані?"
            a: "Поки ти не вирішиш надіслати результати, все залишається у твоєму власному браузері. Нічого не надсилається на наші сервери без твоєї активної згоди."
          - q: "Які дані збираються при згоді?"
            a: "Ігрові дані (намальовані прогнози, метрики точності), за бажанням — завантажений CGM-файл, а також коротка анкета (вік, досвід із CGM, статус діабету тощо)."
          - q: "Чи передаються мої CGM-дані третім особам?"
            a: "Ні. Дані використовуються виключно для цього дослідження і ніколи не продаються та не передаються неавторизованим особам."
          - q: "Чи можу я відмовитися від участі?"
            a: "Так, будь-коли — просто закрий браузер. Щоб видалити вже надіслані дані, звʼяжись із командою дослідження."
          - q: "Що заважає учасникам підробляти результати?"
            a: "Чесно кажучи? Нічого технічного. Оскільки всі дані зберігаються локально у твоєму браузері, ми цілком покладаємося на чесність і добру волю учасників — і справді довіряємо тобі. Якщо ти все ж хочеш похвалитися перед друзями підозріло ідеальним результатом, будь ласка, просто зроби скріншот і відредагуй його в графічному редакторі, або скористайся DevTools браузера для зміни відображуваних чисел. Будь ласка, не надсилай до дослідження підроблені дані — це безпосередньо шкодить науковій цінності дослідження, від якого виграють усі."
      - title: "Допомога та участь"
        items:
          - q: "Що, якщо я знайшов/ла помилку?"
            a: "Будь ласка, відкрий issue на GitHub проєкту: [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). Звіти про помилки дуже корисні для покращення застосунку та виявлення всього, що може вплинути на досвід участі або якість даних."
          - q: "Я розробник(ця) програмного забезпечення. Чи можу я додати функцію?"
            a: "Так, внески вітаються через GitHub проєкту: [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). Ми особливо раді виправленням помилок, покращенням UI, підтримці більшої кількості сенсорів або форматів файлів та іншим змінам, що покращують зручність без зміни наукового протоколу. Оскільки дослідження активне, зміни, що впливають на дизайн дослідження, варто спочатку обговорити з командою."
          - q: "Як ще я можу допомогти дослідженню?"
            a: "Навіть якщо ти не розробник(ця), ти можеш багато зробити. Поділись дослідженням із відповідними спільнотами, розкажи про нього іншим користувачам CGM або зацікавленим людям, повідом про незрозумілі формулювання чи проблеми зручності використання, або звʼяжись із командою дослідження через контактні канали проєкту."
          - q: "Де знайти повний дизайн дослідження?"
            a: "На сторінці \"Дослідження\" у навігаційному меню — там є посилання для завантаження PDF та посилання на репозиторій GitHub."

