    board_participant_title: "참가자 질문"
    board_developer_title: "개발자 질문"
    sections:
      - title: "이 연구가 중요한 이유"
        items:
          - q: "Sugar-Sugar는 무엇인가요?"
            a: "Sugar-Sugar는 Dash로 만든 웹 연구 앱입니다. 혈당 예측을 인터랙티브 게임으로 바꿉니다. CGM 추적의 일부를 보고, 어떻게 이어질지 그린 뒤, 예측을 실제 값과 비교합니다. 목표는 사람이 단기 혈당 역학을 얼마나 정확히 내다볼 수 있는지 측정하는 것입니다."
          - q: "진짜 연구인가요?"
            a: "네. Sugar-Sugar는 실제 연구의 일부입니다. 독일 로스토크 대학의학(Universitätsmedizin Rostock) 윤리위원회의 승인을 받았습니다. 연구가 책임 있게 진행된다는 점을 알리기 위해 배경으로 적습니다."
          - q: "당뇨병이 있는 사람에게 혈당 예측이 왜 중요한가요?"
            a: "당뇨병이 있는 사람에게 정확한 단기 예측은 인슐린, 탄수화물, 운동, 타이밍에 대한 더 안전한 일상 결정을 도울 수 있습니다. 예측이 나아지면 위험한 고혈당과 저혈당을 줄이고 혈당 관리의 스트레스를 낮출 수 있습니다."
          - q: "당뇨병이 없는 사람에게 혈당 예측이 왜 중요한가요?"
            a: "혈당은 에너지, 인지, 기분, 운동 반응, 장기 건강과 연결된 핵심 대사 신호입니다. 당뇨병이 없어도 예측은 음식, 수면, 스트레스, 활동이 대사를 실시간으로 어떻게 만드는지 보여 줍니다 — 예방 건강과 생활 최적화에 유용합니다."
          - q: "머신러닝에 사람의 정확도가 그렇게 중요한 이유는 무엇인가요?"
            a: "현재 CGM 혈당 예측에 대한 공개된 인간 기준선이 없습니다. 정보가 있는 사람이 혈당 추세를 얼마나 잘 읽는지 모르면, ML 모델이 정말 유용한지 평가할 수 없습니다 — 아는 당뇨병 환자보다 나쁠 수도, 특정 상황에서만 나을 수도 있습니다. 이 연구는 그 기준선을 세워, 앞으로의 ML 작업을 의미 있게 비교할 수 있게 합니다."
          - q: "사람은 차트에 안 나오는 것까지 압니다 — 식사, 수면, 스트레스, 소화, 주기. 그게 없으면 그래프 점 아닌가요?"
            a: >-
              CGM 그래프를 볼 때, 이미 혈당이 어디로 가는지 감각이 있습니다.
              모든 요인을 의식적으로 나열하지 않습니다. 곡선을 보고 이미 일어나는 일을 읽습니다.


              기록하지 않은 일도 혈당에 나타납니다.
              식후 스파이크는 탄수화물을 입력했는지와 관계없이 식후 스파이크처럼 보입니다.
              잔여 인슐린은 알아볼 수 있는 방식으로 곡선을 끌어내립니다.
              혈당 선은 추적하지 않은 것까지 포함해, 일어나는 모든 일의 결과입니다.


              또한 본인 CGM 데이터를 올리면 차트는 기록된 탄수화물, 인슐린, 운동을 마커로 보여 줍니다. 맨 혈당 선이 아닙니다.


              주식의 “기술적 분석”과 같나요? 아닙니다.
              주가는 군중 심리로 움직이고, 예측 자체가 시장을 움직입니다.
              혈당은 생화학입니다. 인슐린에는 알려진 작용 곡선이 있습니다. 탄수화물은 알려진 속도로 흡수됩니다.
              다음 한 시간은 지금 이미 움직이고 있는 것에서 대부분 이어집니다.


              연구도 이를 확인합니다. 식사와 인슐린 입력이 있는 모델과 없는 모델을 비교한 연구에서
              그 공변량을 더해도 단기 정확도는 나아지지 않았습니다
              ([Daniels et al., 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC8782424/);
              [The Maastricht Study, 2021](https://pmc.ncbi.nlm.nih.gov/articles/PMC8224858/)).
              다음 한 시간에는 CGM 신호만으로도 정보가 충분합니다.


              하루 전체를 모델에 설명하라고 하지 않습니다.
              질문은 이것입니다. 화면을 보고, 혈당이 어디로 가는지 얼마나 잘 알 수 있는가.
      - title: "연구 진행 방식"
        items:
          - q: "누가 참여할 수 있나요?"
            a: "만 18세 이상이면 누구나. CGM 사용자는 특히 소중하지만, CGM이 없어도 공개 익명 데이터로 플레이할 수 있습니다."
          - q: "어떤 CGM 기기와 형식을 지원하나요?"
            a: "Dexcom, Libre, Medtronic CSV 내보내기와 Nightscout entries.json을 지원합니다. (Nightscout 자체 CSV 내보내기는 불가합니다 — 대부분의 데이터가 빠집니다.) CGM 기기가 없어도 쓸 수 있는 공개 익명 데이터셋도 있습니다."
          - q: "얼마나 걸리나요?"
            a: "각 라운드는 약 2–3분입니다. 전체 세션(12라운드)은 약 30분이지만 여러 번에 나눠 할 수 있습니다."
          - q: "중간에 멈추고 나중에 이어서 할 수 있나요?"
            a: "네. 게임은 진행 상황을 브라우저에 로컬 저장합니다. 12라운드가 한 번에 너무 많으면 탭을 닫고 돌아오세요 — 멈춘 곳에서 이어가라는 안내가 나옵니다. 몇 라운드라도 유용하지만, 추가 라운드는 모두 데이터 품질을 높입니다."
          - q: "한 사람이 여러 번 플레이할 수 있나요?"
            a: "네 — 각 플레이가 별도 세션인 한. 예측 실력은 연습으로 늘 수 있어 결과가 고정되지 않습니다. 정확도는 연속 시도에서 서서히 오를 수 있습니다. 같은 세션을 이어가는 대신 새 세션을 시작하면 시도가 구분되어, 시간에 따른 향상을 포착할 수 있습니다."
          - q: "결과가 마음에 안 들면 다시 시작해야 하나요?"
            a: "정확도가 마음에 안 든다고 다시 시작하지 마세요. 사람은 좋은 점수는 남기고 나쁜 점수는 버리려 하지만, 그러면 연구가 왜곡되고 과학적 타당성이 떨어집니다. 실망스러워도 진행을 초기화하기보다 다음 라운드를 이어가는 것이 가장 좋습니다."
          - q: "정확도 지표는 무엇인가요?"
            a: "예측한 혈당 곡선이 실제에 얼마나 가까웠는지 수량화하는 표준 예측 지표 — MAE, RMSE, MAPE — 를 씁니다. MAE는 평균 절대 오차로, 평균적으로 얼마나 빗나갔는지 알려 줍니다. RMSE는 큰 실수를 더 강하게 벌해, 예측이 크게 틀린 경우를 강조합니다. MAPE는 오차를 퍼센트로 나타내 서로 다른 혈당 범위의 성적을 비교하는 데 도움이 됩니다. 함께 쓰면 단일 점수보다 완전한 그림이 됩니다."
          - q: "이 연구의 한계는 무엇인가요?"
            a: >-
              솔직히 말하겠습니다.

              - **짧은 지평만.** 다음 한 시간을 예측해 달라고 합니다. 더 긴 예측은 측정하지 않은 요인이 지배하는, 훨씬 어려운 문제입니다.

              - **기록된 사건은 불완전할 수 있습니다.** 차트는 CGM 앱이 기록한 것을 보여 줍니다 — 식사나 용량을 기록하지 않으면 나타나지 않고, 당신과 모델 모두 같은 불완전한 그림을 봅니다.

              - **개인 맥락이 없습니다.** 실제 삶에서는 데이터에 없는 것을 압니다 — 감기가 오는 것, 곧 뛰러 갈 것, 세 번째 커피. 이 연구는 개인 지식과 분리해 차트를 읽는 능력을 측정합니다.

              - **실시간 압박이 없습니다.** 차분히 예측 선을 그리는 것과 새벽 2시에 반쯤 잠든 채 용량을 결정하는 것은 다릅니다.

              - **공개 데이터 대 본인 데이터.** 공개 익명 추적으로 플레이하면 본인 혈당을 예측할 때와 정확도가 다를 수 있습니다. 본인 CGM 내보내기(Dexcom, Libre, Medtronic 또는 Nightscout)를 올리길 권합니다 — 본인 패턴에 대한 개인 직감이 ML과의 비교를 흥미롭게 만드는 일부입니다.
      - title: "CGM CSV 다운로드 방법"
        id: download-csv
        items:
          - q: "휴대폰 앱에서 내보낼 수 없는 이유는 무엇인가요?"
            a: "대부분의 CGM 휴대폰 앱은 PDF 보고서만 줍니다. 원본 CSV는 제조사 웹사이트나 xDrip+ 같은 오픈소스 앱에서 나옵니다."
          - q: "Dexcom (Clarity)"
            a: >-
              1. [clarity.dexcom.com](https://clarity.dexcom.com)(미국) 또는 [clarity.dexcom.eu](https://clarity.dexcom.eu)(유럽)을 열고 Dexcom 계정으로 로그인합니다.

              2. Overview 페이지에서 대시보드 **오른쪽 위 모서리의 내보내기 아이콘**을 클릭해야 합니다(날짜 범위 옆 줄의 마지막 아이콘 — 스프레드시트처럼 보입니다). 위쪽 메뉴에는 Export 버튼이 없습니다.

              ![Dexcom Clarity 오른쪽 위 모서리의 내보내기 아이콘을 클릭하세요](/assets/images/dexcom_instruction.jpg)

              3. **Export your data** 창에서 기간(14, 30, 90일 또는 사용자 지정)을 고른 뒤 **Export**를 눌러 CSV를 다운로드합니다.


              Clarity 휴대폰 앱은 CSV를 내보낼 수 없습니다. 웹사이트를 사용하세요.


              영상: [Clarity upload](https://www.youtube.com/watch?v=GTULvbiAkfc), [Navigating Clarity](https://www.youtube.com/watch?v=hNSeKZXV1sM), [G6 / Clarity export](https://www.youtube.com/watch?v=7v-d_FKs6Oo).
          - q: "Abbott FreeStyle Libre (LibreView)"
            a: >-
              1. [libreview.com](https://www.libreview.com)을 열고 Libre 앱과 같은 계정으로 로그인합니다.

              2. 왼쪽 위 **Glucose History** 아이콘(추세 물결)을 클릭합니다.

              3. 오른쪽 위 **Download Glucose Data**를 클릭하고 캡차를 완료한 뒤 다운로드합니다.


              Excel에서 열어 다시 저장하지 마세요 — 날짜가 깨질 수 있습니다. 받은 그대로 올리세요.


              영상: [LibreView setup](https://www.youtube.com/watch?v=xBa6JJEdqcI), [TypeOneTalks export](https://www.youtube.com/watch?v=l09GPGQXOLE).
          - q: "Medtronic (CareLink)"
            a: >-
              1. [carelink.minimed.com](https://carelink.minimed.com)을 열고 로그인합니다.

              2. 최신 펌프(770G / 780G)는 MiniMed Mobile 앱으로 동기화됩니다. 이전 펌프는 CareLink USB 또는 Contour Next Link 업로더가 필요합니다.

              3. **Reports → Data Export (CSV)**로 갑니다.


              영상: [CareLink overview](https://www.youtube.com/watch?v=WGO1YnVJ0eo), [Uploader setup](https://www.youtube.com/watch?v=u_oC2EubVT4).
          - q: "Glooko, Tidepool, xDrip+ 또는 Nightscout"
            a: >-
              **Glooko:** [my.glooko.com](https://my.glooko.com) → Summary → Export as CSV.

              **Tidepool:** Settings(톱니바퀴) → Export My Data → 날짜 선택 → 다운로드.

              **xDrip+:** Menu → Import/Export → Export CSV (SiDiary 형식).

              **Nightscout:** 시작 화면에 사이트 URL을 붙여 넣으세요 — 그것이 완전한 가져오기입니다(혈당과 식사·인슐린). 내려받은 Nightscout JSON이나 CSV는 일부가 빠집니다. URL이 없으면 Dexcom, Libre 또는 Medtronic에서 CSV를 내보내세요.
      - title: "데이터와 개인정보"
        items:
          - q: "내 데이터가 저장되나요?"
            a: "제출을 선택하기 전까지 모든 것은 본인 브라우저에 머뭅니다. 적극적으로 동의하고 결과를 제출하지 않으면 서버로 아무것도 보내지 않습니다."
          - q: "동의하면 어떤 데이터가 수집되나요?"
            a: "플레이 데이터(그린 예측, 정확도 지표), 선택적으로 올린 CGM 파일, 짧은 설문(나이, CGM 경험, 당뇨병 상태 등)입니다."
          - q: "CGM 데이터가 제3자와 공유되나요?"
            a: "아니요. 데이터는 이 연구에만 쓰이며 판매되거나 무단 제3자와 공유되지 않습니다."
          - q: "철회할 수 있나요?"
            a: "네. 브라우저를 닫으면 언제든지 가능합니다. 이미 제출한 데이터를 지우려면 연구팀에 연락해 주세요."
          - q: "누가 결과를 조작하는 것을 막는 것은 무엇인가요?"
            a: "솔직히? 기술적으로는 아무것도 없습니다. 모든 데이터가 본인 브라우저 로컬 저장소에 있으므로, 참가자의 정직함과 선의에 전적으로 의지합니다 — 그리고 진심으로 신뢰합니다. 친구를 감탄시키려고 수상할 정도로 완벽한 예측 점수가 필요하다면, 스크린샷을 찍고 이미지 편집기로 손보거나 브라우저 DevTools로 화면의 숫자를 고치세요. 가짜 데이터를 연구에 제출하지 마세요 — 모두가 혜택을 받는 연구의 과학적 타당성을 직접 해칩니다."
      - title: "도움과 기여"
        items:
          - q: "버그를 찾으면 어떻게 하나요?"
            a: "프로젝트 GitHub [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar)에서 이슈를 열어 주세요. 버그 제보는 앱을 개선하고 연구 경험이나 데이터 품질에 영향을 줄 수 있는 문제를 찾는 데 매우 도움이 됩니다."
          - q: "소프트웨어 개발자입니다. 기능을 기여할 수 있나요?"
            a: "네. 기여는 프로젝트 GitHub [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar)에서 환영합니다. 수정, UI 개선, 더 많은 센서나 파일 형식 지원, 과학 프로토콜을 바꾸지 않고 사용성을 높이는 변경을 특히 환영합니다. 진행 중인 연구이므로 새 설문 항목이나 핵심 과제 변경처럼 중간에 연구 설계에 영향을 주는 변경은 먼저 팀과 상의해야 합니다."
          - q: "그 외에 연구를 도울 방법은 무엇인가요?"
            a: "소프트웨어 개발자가 아니어도 많이 도울 수 있습니다. 관련 커뮤니티에 연구를 공유하고, 다른 CGM 사용자나 관심 있는 사람에게 알리고, 불분명한 문구나 사용성 문제를 신고하고, 어떤 식으로든 협력하고 싶다면 프로젝트 연락 경로로 연구팀에 연락해 주세요."
          - q: "전체 연구 설계는 어디서 볼 수 있나요?"
            a: "탐색 바의 “연구 소개” 페이지에 있으며, PDF 다운로드와 GitHub 저장소 링크가 있습니다."
