          - "%{rounds} rondas metido. Los números son traicioneros - a ver si los engañas."
          - "Empecé a subir en la tabla en %{rounds} rondas. ¿Te animas a acompañarme arriba?"
      keep_practicing:
        lines:
          - "La glucosa es humilde. %{rounds} rondas hechas - a ver si la predices mejor que yo."
          - "%{rounds} rondas, todavía aprendiendo la curva. Ahora tú."
          - "Más difícil de lo que parece, ¿eh? %{rounds} intentos honestos. Gáname. Te reto."
