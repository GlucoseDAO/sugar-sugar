        lines:
          - "Predices la glucosa como un pro. %{rounds} rondas y siempre preciso. ¿Crees que me puedes ganar?"
          - "Cada curva pillada en %{rounds} rondas. Te toca a ti: dale a jugar y trata de superarme."
          - "Instinto de patrones al máximo. %{rounds} rondas y sigo sin fallar. Te toca."
