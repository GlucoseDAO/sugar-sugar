    tag_privacy: "Datenschutz"
    tag_download: "Download"
    tag_other: "Sonstiges"
    section_participant: "Teilnehmer"
    section_developer: "Entwickler"
    reply_placeholder: "Antwort schreiben"
    reply_button: "Antworten"
    board_empty: "Noch keine Fragen. Sei die erste Person."
    board_participant_title: "Fragen von Teilnehmenden"
    board_developer_title: "Fragen von Entwickelnden"
    sections:
      - title: "Warum diese Studie wichtig ist"
        items:
          - q: "Was ist Sugar-Sugar?"
            a: "Sugar-Sugar ist eine webbasierte Forschungs-App, die mit Dash entwickelt wurde. Sie verwandelt Glukoseprognosen in ein interaktives Spiel: Du siehst einen Teil einer CGM-Kurve, zeichnest ein, wie du glaubst, dass sie weitergeht, und vergleichst dann deine Vorhersage mit den realen Werten. Ziel ist es, zu messen, wie genau Menschen kurzfristige Glukosedynamiken antizipieren können."
          - q: "Ist das eine echte Forschungsstudie?"
            a: "Ja. Sugar-Sugar ist Teil einer echten Forschungsarbeit. Die Studie erhielt die Genehmigung der Ethikkommission der Universitätsmedizin Rostock in Deutschland — wir erwähnen dies als Teil des Studienhintergrunds, damit du weißt, dass die Forschung verantwortungsbewusst durchgeführt wird."
          - q: "Warum ist Glukoseprognose für Menschen mit Diabetes wichtig?"
            a: "Für Menschen mit Diabetes können genaue kurzfristige Glukosevorhersagen sicherere alltägliche Entscheidungen über Insulin, Kohlenhydrate, Bewegung und Timing unterstützen. Bessere Vorhersagen helfen, gefährliche Hoch- und Tiefphasen zu reduzieren und das Glukosemanagement weniger stressig zu gestalten."
          - q: "Warum ist Glukoseprognose für Menschen ohne Diabetes wichtig?"
            a: "Glukose ist ein zentrales Stoffwechselsignal, das mit Energie, Kognition, Stimmung, Bewegungsreaktionen und langfristiger Gesundheit verbunden ist. Für Menschen ohne Diabetes kann die Prognose zeigen, wie Ernährung, Schlaf, Stress und Aktivität den Stoffwechsel in Echtzeit beeinflussen — nützlich für Prävention und Lebensstiloptimierung."
          - q: "Warum ist die menschliche Genauigkeit so wichtig für maschinelles Lernen?"
            a: "Es gibt derzeit keinen veröffentlichten menschlichen Referenzwert für CGM-Glukosevorhersagen. Ohne zu wissen, wie gut ein informierter Mensch Glukosetrends vorhersagen kann, lässt sich nicht beurteilen, ob ein KI-Modell wirklich nützlich ist — es könnte schlechter sein als ein erfahrener Diabetiker oder nur in bestimmten Szenarien besser. Diese Studie legt diesen Referenzwert fest, damit künftige KI-Modelle sinnvoll verglichen werden können."
          - q: "Ein Mensch weiß viel mehr, als jedes Diagramm zeigt — Mahlzeiten, Schlaf, Stress, Verdauung, Zyklus. Ohne all das ist das doch nur Kaffeesatzlesen auf Kurven, oder?"
            a: >-
              Wenn du auf deinen CGM-Graphen schaust, hast du bereits ein Gefühl dafür, wohin der Glukosewert steuert.
              Du zählst nicht jeden Faktor bewusst auf. Du schaust auf die Kurve und liest, was bereits passiert.


              Das funktioniert, weil die Dinge, die du nicht protokolliert hast, trotzdem im Glukoseverlauf sichtbar werden.
              Ein Spike nach dem Essen sieht aus wie ein Spike nach dem Essen — egal ob die Kohlenhydrate eingetragen wurden oder nicht.
              Wirkendes Insulin zieht die Kurve auf eine erkennbare Weise nach unten.
              Die Glukoselinie ist das Ergebnis von allem, was gerade passiert, auch von dem, was nicht getrackt wurde.


              Außerdem: Wenn du deine CGM-Daten hochlädst, zeigt das Diagramm protokollierte Kohlenhydrate, Insulin und Bewegung als Markierungen. Es ist also keine nackte Glukoselinie.


              Ist das wie „Technische Analyse" beim Aktienhandel? Nein.
              Aktienkurse bewegen sich durch Massenpsychologie, und die Vorhersage selbst beeinflusst den Markt.
              Glukose ist Biochemie. Insulin hat eine bekannte Wirkungskurve. Kohlenhydrate werden mit bekannter Geschwindigkeit aufgenommen.
              Die nächste Stunde folgt größtenteils aus dem, was gerade bereits in Bewegung ist.


              Forschungsergebnisse bestätigen das: Studien, die Glukose-Vorhersagemodelle mit und ohne Mahlzeiten- und Insulindaten verglichen haben,
              stellten fest, dass das Hinzufügen dieser Kovariaten die kurzfristige Genauigkeit nicht verbesserte
              ([Daniels et al., 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC8782424/);
              [The Maastricht Study, 2021](https://pmc.ncbi.nlm.nih.gov/articles/PMC8224858/)).
              Das CGM-Signal allein enthält genügend Informationen für die nächste Stunde.


              Wir bitten niemanden, einem Modell seinen ganzen Tag zu beschreiben.
              Die Frage ist: Wenn du auf den Bildschirm schaust, wie gut kannst du erkennen, wohin die Glukose steuert?
      - title: "Wie die Studie funktioniert"
        items:
          - q: "Wer kann teilnehmen?"
            a: "Alle ab 18 Jahren. CGM-Nutzende sind besonders wertvoll, aber auch Personen ohne CGM können mit öffentlichen anonymisierten Daten spielen."
          - q: "Welche CGM-Geräte und Formate werden unterstützt?"
            a: "Dexcom, Libre, Medtronic und Nightscout-Exporte werden unterstützt. Ein öffentlicher anonymisierter Datensatz ist ebenfalls verfügbar, wenn du kein CGM-Gerät hast."
          - q: "Wie lange dauert es?"
            a: "Jede Runde dauert etwa 2–3 Minuten. Eine vollständige Sitzung (12 Runden) beträgt ca. 30 Minuten, kann aber auf mehrere Besuche aufgeteilt werden."
          - q: "Kann ich zwischendrin aufhören und später weitermachen?"
            a: "Ja. Das Spiel speichert deinen Fortschritt lokal im Browser. Wenn 12 Runden in einer Sitzung zu viel erscheinen, schließe den Tab und komme wieder — du wirst angeboten, dort weiterzumachen, wo du aufgehört hast. Bereits wenige Runden sind wertvoll, aber jede weitere Runde verbessert die Datenqualität."
          - q: "Kann man mehrmals spielen?"
            a: "Ja — solange jeder Durchlauf eine eigene Sitzung ist. Die Vorhersagefähigkeit kann mit Übung besser werden, daher sind Ergebnisse nicht festgeschrieben; die Genauigkeit kann über aufeinanderfolgende Versuche schrittweise steigen. Eine neue Sitzung zu starten (statt dieselbe fortzusetzen) hält diese Versuche getrennt, sodass sich diese Verbesserung über die Zeit abbilden lässt."
          - q: "Was, wenn mir meine Ergebnisse nicht gefallen? Soll ich neu starten?"
            a: "Bitte starte nicht neu, nur weil du mit deiner Genauigkeit unzufrieden bist. Menschen neigen natürlich dazu, gute Ergebnisse zu behalten und schlechte zu verwerfen — das würde die Studie aber verzerren und die Ergebnisse wissenschaftlich weniger valide machen. Am besten ist es, mit einer weiteren Runde fortzufahren."
          - q: "Was sind die Genauigkeitsmetriken?"
            a: "Wir verwenden Standardmetriken — MAE, RMSE und MAPE — um zu messen, wie nah deine Glukosekurve an der echten lag. MAE ist der durchschnittliche absolute Fehler. RMSE bestraft größere Fehler stärker und hebt Fälle hervor, wo die Vorhersage stark falsch war. MAPE drückt den Fehler als Prozentsatz aus, was Vergleiche über verschiedene Glukosebereiche erleichtert. Zusammen geben diese Metriken ein vollständigeres Bild als eine einzelne Kennzahl."
          - q: "Welche Einschränkungen hat diese Studie?"
            a: >-
              Wir möchten transparent sein:

              - **Nur kurzer Zeithorizont.** Wir bitten dich, die nächste Stunde vorherzusagen. Langfristige Vorhersagen sind ein deutlich schwierigeres Problem, bei dem nicht erfasste Faktoren dominieren.

              - **Protokollierte Ereignisse können unvollständig sein.** Das Diagramm zeigt, was deine CGM-App aufgezeichnet hat — wenn du eine Mahlzeit oder Dosis nicht protokolliert hast, erscheint sie nicht, und sowohl du als auch ein Modell arbeiten mit dem gleichen unvollständigen Bild.

              - **Kein persönlicher Kontext.** Im echten Leben weißt du Dinge, die nicht in den Daten stehen — dass du eine Erkältung bekommst, dass du gleich joggen gehst, dass das dein dritter Kaffee ist. Diese Studie isoliert die Fähigkeit, Diagramme zu lesen, vom persönlichen Wissen.

              - **Kein Echtzeitdruck.** Ruhig eine Vorhersagelinie zu zeichnen ist etwas anderes, als um 2 Uhr nachts im Halbschlaf eine Dosierungsentscheidung zu treffen.

              - **Öffentliche vs. eigene Daten.** Wenn du mit öffentlichen anonymisierten Verläufen spielst, kann deine Genauigkeit von der Vorhersage eigener Glukosewerte abweichen. Wir empfehlen dir, deinen eigenen CGM-Export hochzuladen (Dexcom, Libre, Medtronic oder Nightscout) — deine persönliche Intuition für deine eigenen Muster macht den Vergleich mit ML besonders interessant.
      - title: "So lädst du deine CGM-CSV herunter"
        id: download-csv
        items:
          - q: "Warum kann ich nicht aus der Handy-App exportieren?"
            a: "Die meisten CGM-Apps auf dem Handy liefern nur PDF-Berichte. Die Roh-CSV kommt von der Hersteller-Website oder von Open-Source-Apps wie xDrip+ und Nightscout."
          - q: "Dexcom (Clarity)"
            a: >-
              1. Öffne [clarity.dexcom.com](https://clarity.dexcom.com) (USA) oder [clarity.dexcom.eu](https://clarity.dexcom.eu) (Europa) und melde dich mit deinem Dexcom-Konto an.

              2. Öffne einen beliebigen Bericht und klicke oben auf **Export**.

              3. Wähle einen Zeitraum (14, 30, 90 Tage oder benutzerdefiniert) und lade die CSV herunter.


              Die Clarity-App kann keine CSV exportieren — nutze die Website.


              Videos: [Clarity-Upload](https://www.youtube.com/watch?v=GTULvbiAkfc), [Clarity navigieren](https://www.youtube.com/watch?v=hNSeKZXV1sM), [G6 / Clarity-Export](https://www.youtube.com/watch?v=7v-d_FKs6Oo).
          - q: "Abbott FreeStyle Libre (LibreView)"
            a: >-
              1. Öffne [libreview.com](https://www.libreview.com) und melde dich mit demselben Konto wie in der Libre-App an.

              2. Klicke oben links auf das Symbol **Glucose History** (die Trendwelle).

              3. Klicke oben rechts auf **Download Glucose Data**, löse das Captcha und lade die Datei herunter.


              Öffne die Datei nicht in Excel und speichere sie nicht neu — das kann die Daten verderben. Lade sie so hoch, wie sie heruntergeladen wurde.


              Videos: [LibreView-Einrichtung](https://www.youtube.com/watch?v=xBa6JJEdqcI), [TypeOneTalks-Export](https://www.youtube.com/watch?v=l09GPGQXOLE).
          - q: "Medtronic (CareLink)"
            a: >-
              1. Öffne [carelink.minimed.com](https://carelink.minimed.com) und melde dich an.

              2. Neuere Pumpen (770G / 780G) synchronisieren über die MiniMed-Mobile-App. Ältere Pumpen brauchen den CareLink-USB oder den Contour-Next-Link-Uploader.

              3. Gehe zu **Reports → Data Export (CSV)**.


              Videos: [CareLink-Überblick](https://www.youtube.com/watch?v=WGO1YnVJ0eo), [Uploader-Einrichtung](https://www.youtube.com/watch?v=u_oC2EubVT4).
          - q: "Glooko, Tidepool, xDrip+ oder Nightscout"
            a: >-
              **Glooko:** [my.glooko.com](https://my.glooko.com) → Summary → Export as CSV.

              **Tidepool:** Einstellungen (Zahnrad) → Export My Data → Zeitraum wählen → herunterladen.

              **xDrip+:** Menü → Import/Export → Export CSV (SiDiary-Format).

              **Nightscout:** füge deine Seiten-URL auf der Start- oder Vorhersageseite ein — keine Datei nötig.
      - title: "Daten und Datenschutz"
        items:
          - q: "Werden meine Daten gespeichert?"
            a: "Bis du dich entscheidest zu senden, bleibt alles in deinem eigenen Browser. Nichts wird an unsere Server gesendet, es sei denn, du stimmst aktiv zu und sendest Ergebnisse."
          - q: "Welche Daten werden bei Zustimmung gesammelt?"
            a: "Spieldaten (eingezeichnete Vorhersagen, Genauigkeitsmetriken), optional deine hochgeladene CGM-Datei und ein kurzer Fragebogen (Alter, CGM-Erfahrung, Diabetesstatus usw.)."
          - q: "Werden meine CGM-Daten an Dritte weitergegeben?"
            a: "Nein. Die Daten werden ausschließlich für diese Studie verwendet und niemals verkauft oder an unbefugte Parteien weitergegeben."
          - q: "Kann ich meine Teilnahme widerrufen?"
            a: "Ja, jederzeit, indem du den Browser schließt. Um bereits gesendete Daten löschen zu lassen, kontaktiere bitte das Studienteam."
          - q: "Was hindert jemanden daran, seine Ergebnisse zu fälschen?"
            a: "Ehrlich gesagt? Nichts Technisches. Da alle Daten im lokalen Browserspeicher liegen, vertrauen wir auf die Ehrlichkeit und den guten Willen unserer Teilnehmenden — und wir vertrauen dir wirklich. Falls du deinen Freunden aber mit einem verdächtig perfekten Score imponieren möchtest: Bitte mach einfach einen Screenshot und bearbeite ihn in einem Bildbearbeitungsprogramm, oder nutze die Browser-DevTools, um die angezeigten Zahlen zu ändern. Bitte sende keine gefälschten Daten an die Studie — das schadet direkt der wissenschaftlichen Aussagekraft der Forschung, von der alle profitieren."
      - title: "Hilfe und Mitwirken"
        items:
          - q: "Was, wenn ich einen Fehler gefunden habe?"
            a: "Bitte öffne ein Issue auf dem Projekt-GitHub unter [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). Fehlerberichte helfen sehr, die App zu verbessern und alles zu identifizieren, was die Studienerfahrung oder Datenqualität beeinflussen könnte."
          - q: "Ich bin Softwareentwickler:in. Kann ich eine Funktion beitragen?"
            a: "Ja, Beiträge sind über das Projekt-GitHub unter [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar) willkommen. Wir begrüßen besonders Fehlerkorrekturen, UI-Verbesserungen, Unterstützung für mehr Sensoren oder Dateiformate und andere Änderungen, die die Benutzerfreundlichkeit verbessern, ohne das wissenschaftliche Protokoll zu verändern. Da dies eine laufende Studie ist, sollten Änderungen, die das Studiendesign mitten in der Laufzeit verändern, vorher mit dem Team besprochen werden."
          - q: "Wie kann ich die Studie sonst unterstützen?"
            a: "Auch wenn du kein/e Softwareentwickler:in bist, kannst du viel helfen. Teile die Studie mit relevanten Communitys, weise andere CGM-Nutzende oder interessierte Personen darauf hin, melde unklare Formulierungen oder Usability-Probleme und kontaktiere das Studienteam über die Projektkontaktkanäle, wenn du mitarbeiten möchtest."
          - q: "Wo finde ich das vollständige Studiendesign?"
            a: "Auf der Seite \"Die Studie\" in der Navigationsleiste, die einen PDF-Download und einen Link zum GitHub-Repository enthält."

