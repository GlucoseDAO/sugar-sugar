    sections:
      - title: "Why this study matters"
        items:
          - q: "What is Sugar-Sugar?"
            a: "Sugar-Sugar is a web-based research app built with Dash. It turns glucose forecasting into an interactive game: you see part of a CGM trace, draw how you think it will continue, and then compare your prediction with the real values. The goal is to measure how accurately humans can anticipate short-term glucose dynamics."
          - q: "Is this a real research study?"
            a: "Yes. Sugar-Sugar is part of a real research effort. The study received clearance from the Ethics Committee of University Medicine Rostock (Universitätsmedizin Rostock) in Germany — we mention this as part of the study background so you know the research is conducted responsibly."
          - q: "Why does predicting glucose matter for people with diabetes?"
            a: "For people with diabetes, accurate short-term glucose forecasts can support safer day-to-day decisions about insulin, carbohydrates, exercise, and timing. Better prediction can help reduce dangerous highs and lows and make glucose management less stressful."
          - q: "Why does predicting glucose matter for people without diabetes?"
            a: "Glucose is a core metabolic signal linked to energy, cognition, mood, exercise response, and long-term health. For non-diabetic people, prediction can reveal how food, sleep, stress, and activity shape metabolism in real time — useful for preventive health and lifestyle optimisation."
          - q: "Why is human accuracy so important for machine learning?"
            a: "There is currently no published human-baseline benchmark for CGM glucose prediction. Without knowing how well an informed human can predict glucose trends, we cannot assess whether any ML model is genuinely useful — it might be worse than a knowledgeable diabetic, or better only in specific scenarios. This study establishes that baseline so future ML work can be compared meaningfully."
          - q: "A person knows way more than any chart shows — meals, sleep, stress, digestion, cycle. Without all that, isn't this just fortune-telling on graphs?"
            a: >-
              When you look at your CGM graph, you already have a sense of where glucose is heading.
              You don't list every factor consciously. You look at the curve and read what's already happening.


              That works because the things you didn't log still show up in the glucose.
              A post-meal spike looks like a post-meal spike whether the carbs were entered or not.
              Insulin on board pulls the curve down in a recognizable way.
              The glucose line is the result of everything going on, even what wasn't tracked.


              Also, if you upload your CGM data, the chart shows logged carbs, insulin, and exercise as markers. So it's not a bare glucose line.


              Is this like "technical analysis" in stock trading? No.
              Stock prices move on crowd psychology, and the prediction itself moves the market.
              Glucose is biochemistry. Insulin has a known action curve. Carbs absorb at known rates.
              The next hour mostly follows from what's already in motion right now.


              Research confirms this: studies comparing glucose prediction models with and without meal and insulin inputs
              found that adding those covariates did not improve short-term accuracy
              ([Daniels et al., 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC8782424/);
              [The Maastricht Study, 2021](https://pmc.ncbi.nlm.nih.gov/articles/PMC8224858/)).
              The CGM signal alone carries enough information for the next hour.


              We're not asking anyone to describe their whole day to a model.
              The question is: looking at the screen, how well can you tell where glucose is going?
      - title: "How the study works"
        items:
          - q: "Who can participate?"
            a: "Anyone 18+. CGM users are especially valuable, but non-CGM users can also play with public anonymized data."
          - q: "What CGM devices and formats are supported?"
            a: "Dexcom, Libre and Medtronic CSV exports are supported, as is a Nightscout entries.json file. (Nightscout's own CSV export is not — it leaves out most of the data.) A public anonymized dataset is also available if you don't have a CGM device."
          - q: "How long does it take?"
            a: "Each round takes about 2–3 minutes. A full session (12 rounds) is around 30 minutes, but you can split it across multiple visits."
          - q: "Can I stop partway through and resume later?"
            a: "Yes. The game saves your progress locally in the browser. If 12 rounds feel like too much in one sitting, close the tab and come back — you will be offered to continue from where you left off. At least a few rounds are useful, but every extra round improves the data quality."
          - q: "Can a person play more than once?"
            a: "Yes — as long as each playthrough is a separate session. Prediction skill can improve with practice, so results are not fixed; accuracy may rise gradually across successive attempts. Starting a new session (rather than continuing the same one) keeps those attempts distinct so that improvement can be captured over time."
          - q: "What if I do not like my results? Should I restart?"
            a: "Please do not restart just because you are unhappy with your accuracy. People naturally prefer to keep good scores and discard bad ones, but that would skew the study and make the results less scientifically valid. If you feel disappointed, the best thing is to continue with another round rather than resetting your progress."
          - q: "What are the accuracy metrics?"
            a: "We use standard forecasting metrics — MAE, RMSE, and MAPE — to quantify how close your predicted glucose curve was to the real one. MAE is the average absolute error: it tells you how far off you were on average. RMSE penalises larger mistakes more strongly, so it highlights cases where the prediction was badly wrong. MAPE expresses error as a percentage, which helps compare performance across different glucose ranges. Together these metrics give a more complete picture than a single score."
          - q: "What are the limitations of this study?"
            a: >-
              We want to be upfront:

              - **Short horizon only.** We ask you to predict the next hour. Longer-term prediction is a much harder problem where unmeasured factors dominate.

              - **Logged events may be incomplete.** The chart shows whatever your CGM app recorded — if you didn't log a meal or dose, it won't appear, and both you and a model are working with the same incomplete picture.

              - **No personal context.** In real life, you know things not in the data — that you're coming down with a cold, that you're about to go for a run, that this is your third coffee. This study isolates chart-reading ability from personal knowledge.

              - **No real-time pressure.** Drawing a prediction line calmly is different from making a dosing decision at 2 AM while half asleep.

              - **Public vs. own data.** If you play with public anonymized traces, your accuracy may differ from predicting your own glucose. We encourage you to upload your own CGM export (Dexcom, Libre, Medtronic, or Nightscout) — your personal intuition about your own patterns is part of what makes the comparison with ML interesting.
      - title: "How to download your CGM CSV"
        id: download-csv
        items:
          - q: "Why can't I export from the phone app?"
            a: "Most CGM phone apps only give PDF reports. The raw CSV comes from the manufacturer's website, or from open-source apps such as xDrip+."
          - q: "Dexcom (Clarity)"
            a: >-
              1. Open [clarity.dexcom.com](https://clarity.dexcom.com) (US) or [clarity.dexcom.eu](https://clarity.dexcom.eu) (Europe) and sign in with your Dexcom account.

              2. On the Overview page, you must click the **export icon in the top-right corner** of the dashboard (the last icon in the row next to the date range — it looks like a spreadsheet). There is no Export button in the top menu.

              ![Click the export icon in the top-right corner of Dexcom Clarity](/assets/images/dexcom_instruction.jpg)

              3. In the **Export your data** dialog, choose a date range (14, 30, 90 days, or custom) and click **Export** to download the CSV.


              The Clarity phone app cannot export CSV — use the website.


              Videos: [Clarity upload](https://www.youtube.com/watch?v=GTULvbiAkfc), [Navigating Clarity](https://www.youtube.com/watch?v=hNSeKZXV1sM), [G6 / Clarity export](https://www.youtube.com/watch?v=7v-d_FKs6Oo).
          - q: "Abbott FreeStyle Libre (LibreView)"
            a: >-
              1. Open [libreview.com](https://www.libreview.com) and sign in with the same account as your Libre app.

              2. Click the **Glucose History** icon (the trend wave) in the top-left.

              3. Click **Download Glucose Data** (top-right), complete the captcha, and download.


              Do not open and re-save the file in Excel — that can break the dates. Upload it as downloaded.


              Videos: [LibreView setup](https://www.youtube.com/watch?v=xBa6JJEdqcI), [TypeOneTalks export](https://www.youtube.com/watch?v=l09GPGQXOLE).
          - q: "Medtronic (CareLink)"
            a: >-
              1. Open [carelink.minimed.com](https://carelink.minimed.com) and sign in.

              2. Newer pumps (770G / 780G) sync through the MiniMed Mobile app. Older pumps need the CareLink USB or Contour Next Link uploader.

              3. Go to **Reports → Data Export (CSV)**.


              Videos: [CareLink overview](https://www.youtube.com/watch?v=WGO1YnVJ0eo), [Uploader setup](https://www.youtube.com/watch?v=u_oC2EubVT4).
          - q: "Glooko, Tidepool, xDrip+, or Nightscout"
            a: >-
              **Glooko:** [my.glooko.com](https://my.glooko.com) → Summary → Export as CSV.

              **Tidepool:** Settings (gear) → Export My Data → choose dates → download.

              **xDrip+:** Menu → Import/Export → Export CSV (SiDiary format).

              **Nightscout:** paste your site URL on the startup screen — that is the complete import (glucose plus meal and insulin markers). A downloaded Nightscout JSON or CSV leaves some of that out. If you have no Nightscout URL, export a CSV from Dexcom, Libre, or Medtronic instead.
      - title: "Data and privacy"
        items:
          - q: "Is any of my data stored?"
            a: "Until you choose to submit, everything stays in your own browser. Nothing is sent to our servers unless you actively consent and submit results."
          - q: "What data is collected if I consent?"
            a: "Gameplay data (drawn predictions, accuracy metrics), optionally your uploaded CGM file, and a short questionnaire (age, CGM experience, diabetes status, etc.)."
          - q: "Is my CGM data shared with third parties?"
            a: "No. Data is used solely for this study and never sold or shared with unauthorised parties."
          - q: "Can I withdraw?"
            a: "Yes, at any time by closing the browser. To have already-submitted data removed, please contact the study team."
          - q: "What stops someone from faking their results?"
            a: "Honestly? Nothing technical. Since all data lives in your own browser's local storage, we rely entirely on the honesty and good faith of our participants — and we genuinely trust you. That said, if you really want to impress your friends with a suspiciously perfect prediction score, please just take a screenshot and touch it up in an image editor, or use your browser's DevTools to edit the numbers on screen. Please do not submit fake data to the study — it directly harms the scientific validity of the research that everyone benefits from."
      - title: "Help and contributing"
        items:
          - q: "What if I found a bug?"
            a: "Please open an issue on the project GitHub at [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). Bug reports are very helpful for improving the app and for identifying anything that could affect the study experience or data quality."
          - q: "I am a software developer. Can I contribute a feature?"
            a: "Yes, contributions are welcome through the project GitHub at [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). We especially welcome fixes, UI improvements, support for more sensors or file formats, and other changes that improve usability without altering the scientific protocol. Because this is an active study, changes that affect the study design midstream — such as new questionnaire fields or modifications to the core task — should be discussed with the team first."
          - q: "How else can I help the study?"
            a: "Even if you are not a software developer, you can still help a lot. Share the study with relevant communities, tell other CGM users or interested people about it, report unclear wording or usability problems, and contact the study team through the project contact channels if you would like to collaborate in any way."
          - q: "Where can I find the full study design?"
            a: "On the \"The Study\" page in the navigation bar, which includes a PDF download and a link to the GitHub repository."

