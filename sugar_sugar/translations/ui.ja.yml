    board_empty: "まだ質問はありません。最初の人になりましょう。"
    board_participant_title: "参加者の質問"
    board_developer_title: "開発者の質問"
    sections:
      - title: "この研究が大切な理由"
        items:
          - q: "Sugar-Sugarとは何ですか？"
            a: "Sugar-SugarはDashで作ったウェブ研究アプリです。血糖予測をインタラクティブなゲームにします。CGMトレースの一部を見て、続きを描き、予測を実測と比べます。目的は、人が短期の血糖動態をどれだけ正確に先読みできるかを測ることです。"
          - q: "本物の研究ですか？"
            a: "はい。Sugar-Sugarは本物の研究の一部です。ドイツのロストック大学医学部（Universitätsmedizin Rostock）倫理委員会の承認を受けています。責任ある研究であることを知っていただくために、背景として記しています。"
          - q: "糖尿病をお持ちの方にとって、血糖予測が大切なのはなぜですか？"
            a: "糖尿病をお持ちの方にとって、正確な短期予測はインスリン、炭水化物、運動、タイミングについての、より安全な日常判断を支えられます。予測が良くなれば、危険な高値と低値を減らし、血糖管理のストレスを下げられます。"
          - q: "糖尿病のない人にとって、血糖予測が大切なのはなぜですか？"
            a: "血糖はエネルギー、認知、気分、運動反応、長期の健康につながる中核の代謝信号です。糖尿病がなくても、食事、睡眠、ストレス、活動が代謝をリアルタイムでどう形作るかを予測は示せます — 予防的な健康と生活の最適化に役立ちます。"
          - q: "機械学習にとって、人間の精度がそれほど大切なのはなぜですか？"
            a: "現在、CGM血糖予測の公開された人間ベースラインはありません。情報のある人がどれだけ読めるかを知らなければ、MLモデルが本当に役立つか判断できません — 知識のある糖尿病患者より悪いことも、特定の場面だけで良いこともあります。この研究がそのベースラインを作り、将来のMLを意味のある形で比較できるようにします。"
          - q: "人はグラフに出ないことまで知っています — 食事、睡眠、ストレス、消化、周期。それなしでは、グラフ占いでは？"
            a: >-
              CGMグラフを見るとき、すでに血糖の行き先の感覚があります。
              すべての要因を意識して列挙してはいません。カーブを見て、すでに起きていることを読みます。


              記録していないことも、血糖に現れます。
              食後のスパイクは、炭水化物を入力したかどうかに関係なく食後のスパイクに見えます。
              残存インスリンは、見分けのつく形でカーブを下げます。
              血糖の線は、追跡していないことも含め、起きているすべての結果です。


              自分のCGMデータをアップロードすれば、記録した炭水化物、インスリン、運動がマーカーとして出ます。むき出しの血糖線ではありません。


              株式の「テクニカル分析」のようなものですか？違います。
              株価は群衆心理で動き、予測そのものが市場を動かします。
              血糖は生化学です。インスリンには既知の作用曲線があります。炭水化物は既知の速度で吸収されます。
              次の1時間は、今すでに動き出していることからほとんど決まります。


              研究もこれを裏付けます。食事とインスリン入力の有無を比べた血糖予測モデルの研究では、
              それらの共変量を加えても短期精度は上がりませんでした
              （[Daniels et al., 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC8782424/);
              [The Maastricht Study, 2021](https://pmc.ncbi.nlm.nih.gov/articles/PMC8224858/)）。
              次の1時間には、CGM信号だけで十分な情報があります。


              一日の全部をモデルに説明するようには頼んでいません。
              問いはこれです。画面を見て、血糖の行き先をどれだけ読めるか。
      - title: "研究の進め方"
        items:
          - q: "誰が参加できますか？"
            a: "18歳以上ならどなたでも。CGMユーザーは特に貴重ですが、CGMがなくても公開の匿名データで遊べます。"
          - q: "対応しているCGM機器と形式は？"
            a: "Dexcom、Libre、MedtronicのCSVエクスポートと、Nightscoutのentries.jsonに対応しています。（Nightscout独自のCSVエクスポートは不可です — ほとんどのデータが抜けます。）CGM機器がなくても使える公開匿名データセットもあります。"
          - q: "どのくらい時間がかかりますか？"
            a: "1ラウンドは約2〜3分です。全セッション（12ラウンド）は約30分ですが、複数回に分けられます。"
          - q: "途中で止めて、あとから再開できますか？"
            a: "できます。ゲームは進捗をブラウザにローカル保存します。12ラウンドが一度に多すぎるなら、タブを閉じて戻ってください — 中断したところから続ける案内が出ます。数ラウンドでも役立ちますが、追加ラウンドはどれもデータ品質を上げます。"
          - q: "同じ人が何度も遊べますか？"
            a: "はい — 各プレイスルーが別セッションである限り。予測スキルは練習で伸びることがあるので、結果は固定ではありません。精度は回を重ねて徐々に上がることがあります。同じセッションを続けるのではなく新しいセッションを始めると、試みが分かれ、時間を通じた上達を捉えられます。"
          - q: "結果が気に入らないときは、やり直すべきですか？"
            a: "精度に不満だからといってやり直さないでください。人は良いスコアを残し悪いものを捨てがちですが、それでは研究が歪み、科学的妥当性が落ちます。がっかりしても、進捗をリセットするより次のラウンドを続けるほうがよいです。"
          - q: "精度指標とは何ですか？"
            a: "予測カーブが実測にどれだけ近かったかを数量化する、標準の予測指標 — MAE、RMSE、MAPE — を使います。MAEは平均絶対誤差で、平均してどれだけ外れたかを示します。RMSEは大きな誤りをより強く罰するので、予測が大きく外れたケースを強調します。MAPEは誤差をパーセントで表し、異なる血糖範囲での成績比較に役立ちます。これらを合わせると、単一スコアより完全な絵になります。"
          - q: "この研究の限界は何ですか？"
            a: >-
              率直に言います。

              - **短い地平だけ。** 次の1時間の予測をお願いしています。より長い予測は、測っていない要因が支配する、はるかに難しい問題です。

              - **記録された出来事は不完全かもしれません。** グラフはCGMアプリが記録したものを出します — 食事や投与を記録していなければ出ず、あなたもモデルも同じ不完全な絵で働きます。

              - **個人的な文脈はありません。** 実生活ではデータにないことを知っています — 風邪の兆し、これから走る、三杯目のコーヒー。この研究は、個人知識から切り離してグラフを読む力を測ります。

              - **リアルタイムの圧力はありません。** 落ち着いて予測線を描くことと、午前2時に半分眠い状態で投与判断をすることは違います。

              - **公開データと自分のデータ。** 公開の匿名トレースで遊ぶと、自分の血糖を読む精度とは違うことがあります。自分のCGMエクスポート（Dexcom、Libre、Medtronic、Nightscout）のアップロードを勧めます — 自分のパターンへの個人的な直感こそ、MLとの比較を面白くする一部です。
      - title: "CGM CSVのダウンロード方法"
        id: download-csv
        items:
          - q: "スマホアプリから書き出せないのはなぜですか？"
            a: "ほとんどのCGMスマホアプリはPDFレポートしか出しません。生のCSVはメーカーのウェブサイト、またはxDrip+などのオープンソースアプリから来ます。"
          - q: "Dexcom（Clarity）"
            a: >-
              1. [clarity.dexcom.com](https://clarity.dexcom.com)（米国）または [clarity.dexcom.eu](https://clarity.dexcom.eu)（欧州）を開き、Dexcomアカウントでサインインします。

              2. Overviewページで、ダッシュボードの**右上隅にあるエクスポートアイコン**をクリックしてください（日付範囲の横の列の最後のアイコン — 表計算シートのように見えます）。上部メニューにExportボタンはありません。

              ![Dexcom Clarityの右上隅にあるエクスポートアイコンをクリック](/assets/images/dexcom_instruction.jpg)

              3. **Export your data**ダイアログで期間（14、30、90日、またはカスタム）を選び、**Export**をクリックしてCSVをダウンロードします。


              ClarityのスマホアプリではCSVを書き出せません。ウェブサイトを使ってください。


              動画: [Clarity upload](https://www.youtube.com/watch?v=GTULvbiAkfc), [Navigating Clarity](https://www.youtube.com/watch?v=hNSeKZXV1sM), [G6 / Clarity export](https://www.youtube.com/watch?v=7v-d_FKs6Oo).
          - q: "Abbott FreeStyle Libre（LibreView）"
            a: >-
              1. [libreview.com](https://www.libreview.com) を開き、Libreアプリと同じアカウントでサインインします。

              2. 左上の **Glucose History** アイコン（トレンドの波）をクリックします。

              3. 右上の **Download Glucose Data** をクリックし、キャプチャを完了してダウンロードします。


              Excelで開いて再保存しないでください — 日付が壊れることがあります。ダウンロードしたままアップロードしてください。


              動画: [LibreView setup](https://www.youtube.com/watch?v=xBa6JJEdqcI), [TypeOneTalks export](https://www.youtube.com/watch?v=l09GPGQXOLE).
          - q: "Medtronic（CareLink）"
            a: >-
              1. [carelink.minimed.com](https://carelink.minimed.com) を開いてサインインします。

              2. 新しいポンプ（770G / 780G）はMiniMed Mobileアプリで同期します。古いポンプはCareLink USBまたはContour Next Linkアップローダーが必要です。

              3. **Reports → Data Export (CSV)** に進みます。


              動画: [CareLink overview](https://www.youtube.com/watch?v=WGO1YnVJ0eo), [Uploader setup](https://www.youtube.com/watch?v=u_oC2EubVT4).
          - q: "Glooko、Tidepool、xDrip+、Nightscout"
            a: >-
              **Glooko:** [my.glooko.com](https://my.glooko.com) → Summary → Export as CSV。

              **Tidepool:** Settings（歯車）→ Export My Data → 日付を選んでダウンロード。

              **xDrip+:** Menu → Import/Export → Export CSV（SiDiary形式）。

              **Nightscout:** スタート画面にサイトURLを貼り付けるか、Dexcom / Libre / Medtronicの公式CSVをアップロードしてください。ダウンロードしたNightscoutのJSONは予備であり、一部のデータが欠けます。
      - title: "データとプライバシー"
        items:
          - q: "自分のデータは保存されますか？"
            a: "送信を選ぶまで、すべては自分のブラウザ内に留まります。積極的に同意して結果を送信しない限り、サーバーには何も送られません。"
          - q: "同意した場合、どのデータが集まりますか？"
            a: "プレイデータ（描いた予測、精度指標）、任意でアップロードしたCGMファイル、短い質問票（年齢、CGM経験、糖尿病の状態など）です。"
          - q: "CGMデータは第三者に共有されますか？"
            a: "いいえ。データはこの研究だけに使い、販売や権限のない第三者への共有はしません。"
          - q: "撤回できますか？"
            a: "はい。ブラウザを閉じればいつでもできます。すでに送信したデータの削除は、研究チームにご連絡ください。"
          - q: "結果の改ざんを止めるものはありますか？"
            a: "正直に言うと、技術的には何もありません。データはすべて自分のブラウザのローカルストレージにあるので、参加者の誠実さと善意に全面的に頼っています — そして本当に信頼しています。友人を感心させるために疑わしいほど完璧な予測スコアが欲しいなら、スクリーンショットを撮って画像エディタで直すか、ブラウザのDevToolsで画面上の数字を編集してください。偽データを研究に送らないでください — 皆が恩恵を受ける研究の科学的妥当性を直接損ないます。"
      - title: "助け方と貢献"
        items:
          - q: "バグを見つけたら？"
            a: "プロジェクトのGitHub [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar) でissueを開いてください。バグ報告はアプリの改善と、研究体験やデータ品質に影響しうる問題の特定に非常に役立ちます。"
          - q: "ソフトウェア開発者です。機能を貢献できますか？"
            a: "はい。貢献はプロジェクトのGitHub [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar) で歓迎します。修正、UI改善、より多くのセンサーやファイル形式の対応、科学プロトコルを変えずに使いやすさを上げる変更を特に歓迎します。進行中の研究なので、新しい質問項目や中核課題の変更など、途中で研究デザインに触れる変更は、先にチームと相談してください。"
          - q: "ほかに研究を助ける方法は？"
            a: "ソフトウェア開発者でなくても、大いに助けられます。関連コミュニティに研究を共有し、他のCGMユーザーや関心のある人に伝え、わかりにくい文言や使い勝手の問題を報告し、何か協力したい場合はプロジェクトの連絡先から研究チームに連絡してください。"
          - q: "研究デザインの全文はどこにありますか？"
            a: "ナビゲーションバーの「研究について」ページにあり、PDFダウンロードとGitHubリポジトリへのリンクがあります。"
