          - q: "Какво е Sugar-Sugar?"
            a: "Sugar-Sugar е уеб базирано изследователско приложение, създадено с Dash. Превръща прогнозирането на глюкоза в интерактивна игра: виждате част от CGM следа, начертавате как според вас ще продължи и след това сравнявате предвиждането си с реалните стойности. Целта е да се измери колко точно хората могат да предвиждат краткосрочната динамика на глюкозата."
          - q: "Това истинско научно изследване ли е?"
            a: "Да. Sugar-Sugar е част от истинско научно изследване. Изследването получи одобрение от Етичната комисия на Университетската медицина Росток (Universitätsmedizin Rostock) в Германия — споменаваме това като част от контекста, за да знаете, че изследването се провежда отговорно."
          - q: "Защо предвиждането на глюкоза е важно за хора с диабет?"
            a: "За хора с диабет точните краткосрочни прогнози могат да подпомогнат по-безопасни ежедневни решения за инсулин, въглехидрати, движение и време. По-доброто предвиждане може да намали опасните върхове и спадове и да направи управлението на глюкозата по-малко стресиращо."
          - q: "Защо предвиждането на глюкоза е важно за хора без диабет?"
            a: "Глюкозата е основен метаболитен сигнал, свързан с енергия, познание, настроение, реакция към движение и дългосрочно здраве. За хора без диабет предвиждането може да покаже как храна, сън, стрес и активност оформят метаболизма в реално време — полезно за превантивно здраве и оптимизиране на начина на живот."
          - q: "Защо човешката точност е толкова важна за машинното обучение?"
            a: "В момента няма публикуван човешки базов показател за предвиждане на CGM глюкоза. Без да знаем колко добре информиран човек може да предвиди тенденциите, не можем да преценим дали даден ML модел е наистина полезен — може да е по-лош от знаещ диабетик или по-добър само в конкретни сценарии. Това изследване създава тази база, за да може бъдещата ML работа да се сравнява смислено."
          - q: "Човек знае много повече, отколкото показва която и да е графика — хранения, сън, стрес, храносмилане, цикъл. Без всичко това не е ли това просто гадаене по графики?"
            a: >-
              Когато гледате CGM графиката си, вече имате усещане накъде върви глюкозата.
              Не изброявате всеки фактор съзнателно. Гледате кривата и четете какво вече се случва.


              Това работи, защото нещата, които не сте записали, все пак се виждат в глюкозата.
              Постпрандиалният скок изглежда като постпрандиален скок, независимо дали въглехидратите са въведени.
              Инсулинът на борда дърпа кривата надолу по разпознаваем начин.
              Линията на глюкозата е резултат от всичко, което се случва, дори и от незаписаното.


              Освен това, ако качите CGM данните си, графиката показва записаните въглехидрати, инсулин и движение като маркери. Така че не е гола линия на глюкоза.


              Прилича ли това на „технически анализ“ при търговията с акции? Не.
              Цените на акциите се движат от психологията на тълпата, а самото предвиждане движи пазара.
              Глюкозата е биохимия. Инсулинът има известна крива на действие. Въглехидратите се абсорбират с известни скорости.
              Следващият час най-вече следва от това, което вече е в движение сега.


              Изследванията потвърждават това: сравнения на модели за предвиждане на глюкоза с и без входове за храна и инсулин
              установиха, че добавянето на тези ковариати не подобрява краткосрочната точност
              ([Daniels et al., 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC8782424/);
              [The Maastricht Study, 2021](https://pmc.ncbi.nlm.nih.gov/articles/PMC8224858/)).
              Самият CGM сигнал носи достатъчно информация за следващия час.


              Не молим никого да описва целия си ден на модел.
              Въпросът е: гледайки екрана, колко добре можете да кажете накъде отива глюкозата?
      - title: "Как работи изследването"
        items:
          - q: "Кой може да участва?"
            a: "Всеки над 18 години. Потребителите на CGM са особено ценни, но и хора без CGM могат да играят с публични анонимизирани данни."
          - q: "Кои CGM устройства и формати се поддържат?"
            a: "Поддържат се CSV експорти от Dexcom, Libre и Medtronic, както и Nightscout entries.json. (Собственият CSV експорт на Nightscout не се поддържа — пропуска по-голямата част от данните.) Наличен е и публичен анонимизиран набор, ако нямате CGM устройство."
          - q: "Колко време отнема?"
            a: "Всеки рунд отнема около 2–3 минути. Пълна сесия (12 рунда) е около 30 минути, но можете да я разделите на няколко посещения."
          - q: "Мога ли да спра по средата и да продължа по-късно?"
            a: "Да. Играта запазва напредъка локално в браузъра. Ако 12 рунда са твърде много наведнъж, затворете раздела и се върнете — ще ви бъде предложено да продължите оттам, където сте спрели. Поне няколко рунда са полезни, но всеки допълнителен рунд подобрява качеството на данните."
          - q: "Може ли човек да играе повече от веднъж?"
            a: "Да — стига всяко преминаване да е отделна сесия. Умението за предвиждане може да се подобри с практика, така че резултатите не са фиксирани; точността може да расте постепенно при последователни опити. Започването на нова сесия (вместо продължаване на същата) държи опитите отделни, за да може подобрението да се улови във времето."
          - q: "Ами ако не харесвам резултатите си? Трябва ли да рестартирам?"
            a: "Моля, не рестартирайте само защото не сте доволни от точността. Хората естествено предпочитат да запазят добрите резултати и да отхвърлят лошите, но това би изкривило изследването и би направило резултатите по-малко научно валидни. Ако сте разочаровани, най-доброто е да продължите с още един рунд, вместо да нулирате напредъка."
          - q: "Какви са показателите за точност?"
            a: "Използваме стандартни показатели за прогнозиране — MAE, RMSE и MAPE — за да измерим колко близо е била предвидената крива до реалната. MAE е средната абсолютна грешка: казва колко далеч сте били средно. RMSE наказва по-силно големите грешки, така че подчертава случаите, в които предвиждането е било сериозно грешно. MAPE изразява грешката като процент, което помага да се сравнява представянето в различни диапазони на глюкоза. Заедно тези показатели дават по-пълна картина от една оценка."
          - q: "Какви са ограниченията на това изследване?"
            a: >-
              Искаме да сме открити:

              - **Само кратък хоризонт.** Молим ви да предвидите следващия час. Дългосрочното предвиждане е много по-труден проблем, в който доминират неизмерени фактори.

              - **Записаните събития може да са непълни.** Графиката показва това, което CGM приложението е записало — ако не сте записали хранене или доза, то няма да се появи, и вие, и моделът работите с една и съща непълна картина.

              - **Без личен контекст.** В реалния живот знаете неща, които не са в данните — че настивате, че ще тичате, че това е третото кафе. Това изследване изолира умението да се чете графиката от личното знание.

              - **Без натиск в реално време.** Да начертаете линия спокойно е различно от решение за доза в 2 през нощта на полусън.

              - **Публични срещу собствени данни.** Ако играете с публични анонимизирани следи, точността ви може да се различава от предвиждането на собствената глюкоза. Насърчаваме ви да качите собствен CGM експорт (Dexcom, Libre, Medtronic или Nightscout) — личната ви интуиция за собствените модели е част от това, което прави сравнението с ML интересно.
      - title: "Как да изтеглите CGM CSV"
        id: download-csv
        items:
          - q: "Защо не мога да експортирам от приложението на телефона?"
            a: "Повечето CGM приложения за телефон дават само PDF доклади. Суровият CSV идва от сайта на производителя или от приложения с отворен код като xDrip+."
          - q: "Dexcom (Clarity)"
            a: >-
              1. Отворете [clarity.dexcom.com](https://clarity.dexcom.com) (САЩ) или [clarity.dexcom.eu](https://clarity.dexcom.eu) (Европа) и влезте с акаунта си в Dexcom.

              2. На страницата Overview трябва да кликнете **иконата за експорт в горния десен ъгъл** на таблото (последната икона в реда до периода — прилича на таблица). Няма бутон Export в горното меню.

              ![Кликнете иконата за експорт в горния десен ъгъл на Dexcom Clarity](/assets/images/dexcom_instruction.jpg)

              3. В прозореца **Export your data** изберете период (14, 30, 90 дни или персонализиран) и кликнете **Export**, за да изтеглите CSV.


              Приложението Clarity за телефон не може да експортира CSV — използвайте уебсайта.


              Видеа: [Clarity upload](https://www.youtube.com/watch?v=GTULvbiAkfc), [Navigating Clarity](https://www.youtube.com/watch?v=hNSeKZXV1sM), [G6 / Clarity export](https://www.youtube.com/watch?v=7v-d_FKs6Oo).
          - q: "Abbott FreeStyle Libre (LibreView)"
            a: >-
              1. Отворете [libreview.com](https://www.libreview.com) и влезте със същия акаунт като приложението Libre.

              2. Кликнете иконата **Glucose History** (вълната на тенденцията) горе вляво.

              3. Кликнете **Download Glucose Data** (горе вдясно), попълнете captcha и изтеглете.


              Не отваряйте и не записвайте отново файла в Excel — това може да счупи датите. Качете го така, както е изтеглен.


              Видеа: [LibreView setup](https://www.youtube.com/watch?v=xBa6JJEdqcI), [TypeOneTalks export](https://www.youtube.com/watch?v=l09GPGQXOLE).
          - q: "Medtronic (CareLink)"
            a: >-
              1. Отворете [carelink.minimed.com](https://carelink.minimed.com) и влезте.

              2. По-новите помпи (770G / 780G) се синхронизират чрез приложението MiniMed Mobile. По-старите помпи се нуждаят от CareLink USB или Contour Next Link uploader.

              3. Отидете на **Reports → Data Export (CSV)**.


              Видеа: [CareLink overview](https://www.youtube.com/watch?v=WGO1YnVJ0eo), [Uploader setup](https://www.youtube.com/watch?v=u_oC2EubVT4).
          - q: "Glooko, Tidepool, xDrip+ или Nightscout"
            a: >-
              **Glooko:** [my.glooko.com](https://my.glooko.com) → Summary → Export as CSV.

              **Tidepool:** Settings (зъбно колело) → Export My Data → изберете дати → изтеглете.

              **xDrip+:** Menu → Import/Export → Export CSV (формат SiDiary).

              **Nightscout:** поставете URL на сайта си на началния екран — това е пълният импорт (глюкоза плюс храна и инсулин). Изтегленият Nightscout JSON или CSV пропуска част от това. Ако нямате URL, експортирайте CSV от Dexcom, Libre или Medtronic.
      - title: "Данни и поверителност"
        items:
          - q: "Съхраняват ли се някакви мои данни?"
            a: "Докато не изберете да изпратите, всичко остава в собствения ви браузър. Нищо не се изпраща към нашите сървъри, освен ако активно не дадете съгласие и не изпратите резултати."
          - q: "Какви данни се събират, ако дам съгласие?"
            a: "Данни от играта (начертани предвиждания, показатели за точност), по желание каченият ви CGM файл и кратък въпросник (възраст, опит с CGM, статус на диабет и др.)."
          - q: "Споделят ли се CGM данните ми с трети страни?"
            a: "Не. Данните се използват единствено за това изследване и никога не се продават или споделят с неупълномощени страни."
          - q: "Мога ли да се оттегля?"
            a: "Да, по всяко време, като затворите браузъра. За вече изпратени данни се свържете с екипа на изследването."
          - q: "Какво спира някого да фалшифицира резултатите си?"
            a: "Честно? Нищо техническо. Тъй като всички данни живеят в локалното хранилище на вашия браузър, разчитаме изцяло на честността и добрата воля на участниците — и наистина ви се доверяваме. Ако наистина искате да впечатлите приятели със съмнително перфектен резултат, моля просто направете екранна снимка и я пипнете в редактор на изображения или използвайте DevTools на браузъра, за да редактирате числата на екрана. Моля, не изпращайте фалшиви данни към изследването — това пряко вреди на научната валидност на изследването, от което всички печелим."
      - title: "Помощ и принос"
        items:
          - q: "Ами ако открих грешка?"
            a: "Моля, отворете issue в GitHub на проекта на [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). Докладите за грешки са много полезни за подобряване на приложението и за откриване на всичко, което може да засегне преживяването или качеството на данните."
          - q: "Аз съм софтуерен разработчик. Мога ли да допринеса с функция?"
            a: "Да, приносът е добре дошъл чрез GitHub на проекта на [github.com/GlucoseDAO/sugar-sugar](https://github.com/GlucoseDAO/sugar-sugar). Особено приветстваме поправки, подобрения на интерфейса, поддръжка за повече сензори или файлови формати и други промени, които подобряват използваемостта без да променят научния протокол. Тъй като това е активно изследване, промени, които засягат дизайна по средата — като нови полета във въпросника или промени в основната задача — трябва първо да се обсъдят с екипа."
          - q: "Как иначе мога да помогна на изследването?"
            a: "Дори да не сте софтуерен разработчик, все пак можете да помогнете много. Споделете изследването с релевантни общности, разкажете на други потребители на CGM или заинтересовани хора, докладвайте неясни формулировки или проблеми с използваемостта и се свържете с екипа чрез каналите за контакт на проекта, ако искате да сътрудничите по някакъв начин."
          - q: "Къде мога да намеря пълния дизайн на изследването?"
            a: "На страницата „Изследването“ в лентата за навигация, която включва изтегляне на PDF и връзка към хранилището в GitHub."
